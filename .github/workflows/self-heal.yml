name: Self-heal

on:
  workflow_dispatch:
    inputs:
      error_id:
        description: Sentry issue ID
        required: true
      error_title:
        description: Error title
        required: true
      stack_trace:
        description: Stack trace or request details
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ERROR_ID: ${{ inputs.error_id }}
      ERROR_TITLE: ${{ inputs.error_title }}
      STACK_TRACE: ${{ inputs.stack_trace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt pyyaml

      - name: Build prompt
        run: |
          {
            echo "PROMPT<<PROMPT_EOF"
            echo "A production error was reported in this app."
            echo "Error: $ERROR_TITLE"
            echo "Details:"
            echo "$STACK_TRACE"
            echo
            echo "Fix it. Follow these rules exactly:"
            cat .selfheal/rules.md
            echo
            echo "Protected files (never edit):"
            grep -A20 '^protected_files:' .selfheal/config.yml | grep '^  - '
            echo
            echo "When done, reply with a short plain-language summary: what was wrong, what you changed, and the test you added."
            echo "PROMPT_EOF"
          } >> "$GITHUB_ENV"

      - name: Run agent
        id: agent
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.5-flash-lite
          prompt: ${{ env.PROMPT }}

      - name: Check agent changes
        run: python .selfheal/check_changes.py

      - name: Run tests
        run: pytest

      - name: Open pull request
        env:
          SUMMARY: ${{ steps.agent.outputs.summary }}
        run: |
          branch="selfheal/${ERROR_ID}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "Fix: ${ERROR_TITLE}"
          git push origin "$branch"
          {
            echo "## Automated fix for Sentry issue ${ERROR_ID}"
            echo
            echo "**Error:** ${ERROR_TITLE}"
            echo
            echo "$SUMMARY"
            echo
            echo "_Generated by the self-heal workflow. Tests pass. Please review before merging._"
          } > pr_body.md
          gh pr create --title "Fix: ${ERROR_TITLE}" --body-file pr_body.md --base "${GITHUB_REF_NAME}"
